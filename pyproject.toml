[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mortechley-mixsft"
version = "0.1.0"
description = "按结构键把条目聚类，标出指令微调的数据混合上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mortechley" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mortechley.github.io"
Repository = "https://github.com/mortechley/mixsft"
Issues = "https://github.com/mortechley/mixsft/issues"

[project.scripts]
mixsft = "mixsft:main"

[tool.setuptools]
py-modules = ["mixsft"]
